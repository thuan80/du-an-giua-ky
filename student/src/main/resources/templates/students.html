<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sinh viên</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 24px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .toolbar input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        form.student-form {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        form.student-form input {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
        }
        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 8px;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 4px;
            padding: 8px 14px;
            font-weight: 600;
        }
        button.primary { background: #2980b9; color: #fff; }
        button.secondary { background: #95a5a6; color: #fff; }
        button.danger { background: #e74c3c; color: #fff; }
        button.edit { background: #f39c12; color: #fff; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: #34495e;
            color: #fff;
        }
        tr:hover { background: #f9f9f9; }
        td.actions { display: flex; gap: 6px; }
        #message {
            margin-bottom: 12px;
            font-size: 14px;
        }
        #message.error { color: #e74c3c; }
        #message.ok { color: #27ae60; }
        .empty-row td {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Quản lý sinh viên</h1>

    <div id="message"></div>

    <div class="card">
        <div class="toolbar">
            <input type="text" id="keyword" placeholder="Tìm theo mã SV / họ tên / email / SĐT...">
            <button class="primary" onclick="loadStudents()">Tìm kiếm</button>
            <button class="secondary" onclick="clearSearch()">Xóa tìm kiếm</button>
</div>
    </div>

    <div class="card">
        <h3 id="formTitle">Thêm sinh viên</h3>
        <form class="student-form" id="studentForm" onsubmit="return submitForm(event)">
            <input type="hidden" id="studentId">
            <input type="text" id="studentCode" placeholder="Mã sinh viên" required>
            <input type="text" id="fullName" placeholder="Họ và tên" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="text" id="phone" placeholder="Số điện thoại">
            <input type="text" id="className" placeholder="Lớp">
            <div class="form-actions">
                <button type="submit" class="primary" id="submitBtn">Thêm sinh viên</button>
                <button type="button" class="secondary" onclick="resetForm()">Hủy</button>
            </div>
        </form>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ và tên</th>
                <th>Email</th>
                <th>SĐT</th>
                <th>Lớp</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody id="studentTableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = '/api/students';

    document.addEventListener('DOMContentLoaded', loadStudents);

    function showMessage(text, isError) {
        const el = document.getElementById('message');
        el.textContent = text;
        el.className = isError ? 'error' : 'ok';
        if (text) {
            setTimeout(() => { el.textContent = ''; el.className = ''; }, 3000);
        }
    }

    function clearSearch() {
        document.getElementById('keyword').value = '';
        loadStudents();
    }

    async function loadStudents() {
        const keyword = document.getElementById('keyword').value.trim();
        const url = keyword ? `${API_URL}?keyword=${encodeURIComponent(keyword)}` : API_URL;
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Không tải được danh sách sinh viên');
            const students = await res.json();
            renderTable(students);
        } catch (err) {
            showMessage(err.message, true);
        }
    }

    function renderTable(students) {
        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = '';

        if (!students || students.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Không có sinh viên nào</td></tr>';
            return;
        }

        students.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHtml(s.studentCode)}</td>
                <td>${escapeHtml(s.fullName)}</td>
                <td>${escapeHtml(s.email)}</td>
                <td>${escapeHtml(s.phone || '')}</td>
<td>${escapeHtml(s.className || '')}</td>
                <td class="actions">
                    <button class="edit" onclick='editStudent(${JSON.stringify(s)})'>Sửa</button>
                    <button class="danger" onclick="deleteStudent('${s.id}')">Xóa</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value ?? '';
        return div.innerHTML;
    }

    function editStudent(student) {
        document.getElementById('studentId').value = student.id;
        document.getElementById('studentCode').value = student.studentCode || '';
        document.getElementById('fullName').value = student.fullName || '';
        document.getElementById('email').value = student.email || '';
        document.getElementById('phone').value = student.phone || '';
        document.getElementById('className').value = student.className || '';

        document.getElementById('formTitle').textContent = 'Cập nhật sinh viên';
        document.getElementById('submitBtn').textContent = 'Cập nhật';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('studentForm').reset();
        document.getElementById('studentId').value = '';
        document.getElementById('formTitle').textContent = 'Thêm sinh viên';
        document.getElementById('submitBtn').textContent = 'Thêm sinh viên';
    }

    async function submitForm(event) {
        event.preventDefault();

        const id = document.getElementById('studentId').value;
        const payload = {
            studentCode: document.getElementById('studentCode').value.trim(),
            fullName: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            className: document.getElementById('className').value.trim()
        };

        try {
            let res;
            if (id) {
                res = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }

            if (!res.ok) throw new Error('Lưu sinh viên thất bại');

            showMessage(id ? 'Cập nhật sinh viên thành công' : 'Thêm sinh viên thành công', false);
            resetForm();
            loadStudents();
        } catch (err) {
            showMessage(err.message, true);
        }

        return false;
    }

    async function deleteStudent(id) {
if (!confirm('Bạn có chắc muốn xóa sinh viên này?')) return;
        try {
            const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Xóa sinh viên thất bại');
            showMessage('Đã xóa sinh viên', false);
            loadStudents();
        } catch (err) {
            showMessage(err.message, true);
        }
    }
</script>
</body>
</html>
